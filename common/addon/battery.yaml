binary_sensor:
  - platform: status
    name: "BatteryOnline"
    id: ink_ha_connected
    icon: mdi:battery
script:
  - id: battery_status_refresh
    mode: restart
    then:
      - lambda: |-
          battery_status_set_wifi_icon(id(battery_status_icon_label),
                                       id(wifi_strength_percent).state,
                                       wifi::global_wifi_component != nullptr &&
                                         wifi::global_wifi_component->is_connected());

  - id: battery_status_open_info
    mode: single
    then:
      - lambda: |-
          battery_status_open_modal(
            "${friendly_name}",
            battery_status_ip_address(),
            "${firmware_version}",
            id(${media_title_font})->get_lv_font(),
            id(${icon_font})->get_lv_font());

sensor:
  - platform: adc
    pin: GPIO52
    id: battery_voltage
    name: "${friendly_name} Battery Voltage"
    entity_category: diagnostic
    internal: true
    attenuation: 12db
    update_interval: 60s

  - platform: copy
    source_id: battery_voltage
    id: battery_percent
    name: "${friendly_name} Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:battery
    filters:
      - lambda: |-
          float p = (x - 1.80f) * 100.0f / (2.43f - 1.80f);

          if (p < 0) p = 0;
          if (p > 100) p = 100;

          return p;